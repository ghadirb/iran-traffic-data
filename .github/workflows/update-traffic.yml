name: Update Traffic Data (WazeAPI)

on:
  schedule:
    # هر ۱۰ دقیقه یک‌بار (UTC) — حداقل فاصله مجاز ۵ دقیقه است
    - cron: '*/10 * * * *'
  workflow_dispatch:  # امکان اجرای دستی از تب Actions

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # برای pull --rebase نیاز به تاریخچه کامل‌تر داریم
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update traffic data from WazeAPI
        env:
          # کلیدها را با کاما از هم جدا کنید (هر تعداد که بخواهید)
          # مثال: wz_live_xxx,wz_live_yyy,wz_live_zzz
          WAZE_API_KEYS: ${{ secrets.WAZE_API_KEYS }}
        run: |
          python scripts/update_traffic.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/*.json key_state.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Iran traffic data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # اگر ریموت در این بین تغییر کرده باشد، اول rebase می‌کنیم
            git pull --rebase origin main || git pull --rebase --autostash origin main
            git push origin main
          fi
